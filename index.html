<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Burner - Ultra-Sync</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; text-align: center; padding: 15px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; max-width: 400px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .email-box { background: #000; padding: 15px; border-radius: 10px; border: 1px solid #00d1b2; color: #00d1b2; font-family: monospace; font-size: 1.1rem; margin: 15px 0; word-break: break-all; min-height: 1.5rem; display: flex; align-items: center; justify-content: center; }
        select, button { width: 100%; padding: 14px; border-radius: 8px; margin: 8px 0; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        select { background: #2d2d2d; color: white; border: 1px solid #444; }
        .btn-main { background: #00d1b2; color: black; }
        .btn-gen { background: #ffdd57; color: black; }
        .btn-copy-otp { background: #ff3860; color: white; margin-top: 10px; font-size: 0.8rem; padding: 8px; width: auto; display: inline-block; }
        .btn-del { background: transparent; color: #666; font-size: 0.7rem; border: 1px solid #444; padding: 4px 8px; width: auto; float: right; }
        .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.7rem; color: #666; margin-top: 10px; }
        .pulse { width: 8px; height: 8px; background: #00d1b2; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        
        .msg-list { text-align: left; margin-top: 20px; }
        .msg-item { background: #252525; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #00d1b2; overflow: hidden; }
        .msg-header { padding: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .msg-header:hover { background: #2d2d2d; }
        .msg-subject { font-size: 0.9rem; font-weight: bold; display: block; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .msg-from { font-size: 0.7rem; color: #888; }
        .content-view { display: none; background: #111; padding: 15px; color: #bbb; font-size: 0.85rem; white-space: pre-wrap; border-top: 1px solid #333; }
        .content-view.open { display: block; }
        .arrow { font-size: 0.6rem; color: #666; transition: 0.3s; }
        .arrow.rotate { transform: rotate(180deg); }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0;">🛡️ Turbo Burner</h2>
    <label style="font-size: 0.8rem; color: #888;">Select Domain</label>
    <select id="domainList"><option value="">Loading domains...</option></select>
    <button class="btn-gen" onclick="createNew()">✨ Create New Email</button>
    <div id="addr" class="email-box">Checking memory...</div>
    <button class="btn-main" onclick="copyText(email)">📋 Copy Email</button>
    <div class="status-bar"><span class="pulse"></span><span id="status">Syncing...</span></div>
    <div id="inbox" class="msg-list"></div>
</div>

<script>
    let token = localStorage.getItem('tm_token') || ""; 
    let email = localStorage.getItem('tm_email') || "";
    const api = "https://api.mail.tm";
    let lastMsgCount = -1; 
    let isChecking = false;
    let checkInterval = null;

    function startSyncTimer() {
        if (checkInterval) clearInterval(checkInterval);
        checkInterval = setInterval(check, 10000);
    }

    async function fetchDomains() {
        const list = document.getElementById('domainList');
        try {
            const res = await fetch(`${api}/domains`);
            if (!res.ok) throw new Error("HTTP Error " + res.status);
            const doms = await res.json();
            const members = doms['hydra:member'] || [];
            
            list.innerHTML = "";
            let addedCount = 0;

            members.forEach(d => {
                if (d.domain && d.isIsActive !== false) {
                    let o = document.createElement('option');
                    o.value = d.domain; 
                    o.innerText = "@" + d.domain;
                    list.appendChild(o);
                    addedCount++;
                }
            });

            if (addedCount === 0) {
                list.innerHTML = '<option value="">No domains available</option>';
                return false;
            }
            return true;
        } catch (e) {
            console.error("Domain Fetch Error:", e);
            list.innerHTML = '<option value="">Failed to load domains (Retry)</option>';
            return false;
        }
    }

    async function init() {
        const domainsLoaded = await fetchDomains();
        
        if (email && token) {
            document.getElementById('addr').innerText = email;
            await check();
            startSyncTimer();
        } else {
            document.getElementById('addr').innerText = domainsLoaded ? "Create an email to start" : "Domain Error - Refresh";
            document.getElementById('status').innerText = domainsLoaded ? "Ready" : "API Offline";
        }
    }

    async function createNew() {
        if (isChecking) return;
        const domainList = document.getElementById('domainList');
        
        if (!domainList.value) {
            document.getElementById('status').innerText = "Retrying domain fetch...";
            const retryOk = await fetchDomains();
            if (!retryOk || !domainList.value) {
                alert("Could not reach Mail.tm API domains. Please check your internet connection or ad blockers.");
                return;
            }
        }

        const domain = domainList.value;
        const user = Math.random().toString(36).substring(2, 12);
        const newEmail = `${user}@${domain}`;
        const pass = "Password123!";
        
        document.getElementById('status').innerText = "Creating account...";
        
        try {
            const accRes = await fetch(`${api}/accounts`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({address: newEmail, password: pass})
            });

            if (!accRes.ok && accRes.status !== 422) {
                throw new Error("Account creation failed");
            }

            const authRes = await fetch(`${api}/token`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({address: newEmail, password: pass})
            });

            if (!authRes.ok) throw new Error("Auth token failed");
            
            const auth = await authRes.json();
            
            token = auth.token; 
            email = newEmail;
            localStorage.setItem('tm_token', token);
            localStorage.setItem('tm_email', email);
            
            document.getElementById('addr').innerText = email;
            document.getElementById('inbox').innerHTML = "";
            lastMsgCount = -1;
            
            await check();
            startSyncTimer();
        } catch (e) { 
            console.error(e);
            alert("Rate limit or API issue encountered. Please wait a moment and try again."); 
            document.getElementById('status').innerText = "Rate limited";
        }
    }

    async function check() {
        if (!token || isChecking) return;
        isChecking = true;
        try {
            const res = await fetch(`${api}/messages`, {
                headers: {'Authorization': `Bearer ${token}`}
            });
            
            if (res.status === 401) {
                // Token expired/invalidated, clear session
                localStorage.removeItem('tm_token');
                localStorage.removeItem('tm_email');
                token = ""; email = "";
                document.getElementById('addr').innerText = "Session expired. Create a new email.";
                document.getElementById('status').innerText = "Expired";
                isChecking = false;
                return;
            }

            if (res.status === 429 || res.status === 503) {
                document.getElementById('status').innerText = "API Busy... Backing off";
                isChecking = false;
                return;
            }

            const data = await res.json();
            const messages = data['hydra:member'] || [];
            
            if (messages.length !== lastMsgCount) {
                lastMsgCount = messages.length;
                const box = document.getElementById('inbox');
                box.innerHTML = "";
                
                if (messages.length === 0) {
                    box.innerHTML = `<div style="text-align:center; color:#666; font-size:0.85rem; margin-top:20px;">Waiting for incoming messages...</div>`;
                } else {
                    for (let m of messages) {
                        let d = document.createElement('div');
                        d.className = 'msg-item';
                        d.innerHTML = `
                            <div class="msg-header" onclick="toggleMsg(this)">
                                <div>
                                    <span class="msg-from">${m.from ? m.from.address : 'Unknown'}</span><br>
                                    <span class="msg-subject">${m.subject || '(No Subject)'}</span>
                                </div>
                                <span class="arrow">▼</span>
                            </div>
                            <div class="content-view" id="content-${m.id}">Loading content...</div>
                        `;
                        box.appendChild(d);
                    }
                }
            }
            document.getElementById('status').innerText = "Live: " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        } catch (e) { 
            document.getElementById('status').innerText = "Connection Error"; 
        } finally {
            isChecking = false;
        }
    }

    async function toggleMsg(header) {
        const contentView = header.nextElementSibling;
        const arrow = header.querySelector('.arrow');
        const msgId = contentView.id.replace('content-', '');

        const isOpen = contentView.classList.toggle('open');
        arrow.classList.toggle('rotate');

        if (isOpen && contentView.innerText === "Loading content...") {
            try {
                const fullMsg = await fetch(`${api}/messages/${msgId}`, {
                    headers: {'Authorization': `Bearer ${token}`}
                }).then(r => r.json());
                
                let searchPool = `${fullMsg.text || ''} ${fullMsg.intro || ''} ${Array.isArray(fullMsg.html) ? fullMsg.html.join(' ') : (fullMsg.html || '')}`;
                let otp = extractOTP(searchPool);

                let displayBody = "";
                if (fullMsg.text) {
                    displayBody = `<div style="padding: 5px; color: #bbb;">${fullMsg.text}</div>`;
                } else if (fullMsg.html) {
                    let htmlContent = Array.isArray(fullMsg.html) ? fullMsg.html.join('') : fullMsg.html;
                    displayBody = `<iframe srcdoc="${htmlContent.replace(/"/g, '&quot;')}" style="width:100%; border:none; height:300px; background:white; border-radius:6px; margin-top:10px;"></iframe>`;
                } else {
                    displayBody = `<div style="padding: 5px; color: #bbb;">${fullMsg.intro || "No content available."}</div>`;
                }
                
                contentView.innerHTML = `
                    <button class="btn-del" onclick="deleteMsg(event, '${msgId}')">Delete</button>
                    <div style="margin-top:10px;">${displayBody}</div>
                    ${otp ? `<button class="btn-copy-otp" onclick="copyText('${otp}')">📋 Copy OTP: ${otp}</button>` : ''}
                `;
            } catch (e) { contentView.innerText = "Error loading content."; }
        }
    }

    async function deleteMsg(event, id) {
        event.stopPropagation(); 
        if(!confirm("Delete this message?")) return;
        try {
            document.getElementById(`content-${id}`).innerText = "Deleting...";
            await fetch(`${api}/messages/${id}`, {
                method: 'DELETE',
                headers: {'Authorization': `Bearer ${token}`}
            });
            lastMsgCount = -1; 
            await check();
        } catch (e) { 
            console.error("Delete error:", e); 
        }
    }

    function extractOTP(text) {
        if (!text) return null;
        const otpMatch = text.match(/\b\d{4,8}\b/);
        return otpMatch ? otpMatch[0] : null;
    }

    function copyText(val) {
        if(!val) return;
        navigator.clipboard.writeText(val).then(() => {
            alert("Copied directly to clipboard!");
        }).catch(err => {
            alert("Failed to copy automatically.");
        });
    }

    init();
</script>
</body>
</html>
