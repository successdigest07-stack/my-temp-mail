<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Burner - 1s Ultra-Sync</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; text-align: center; padding: 15px; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 20px; border: 1px solid #333; max-width: 400px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .email-box { background: #000; padding: 15px; border-radius: 10px; border: 1px solid #00d1b2; color: #00d1b2; font-family: monospace; font-size: 1.1rem; margin: 15px 0; word-break: break-all; min-height: 1.5rem; display: flex; align-items: center; justify-content: center; }
        select, button { width: 100%; padding: 14px; border-radius: 8px; margin: 8px 0; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        select { background: #2d2d2d; color: white; border: 1px solid #444; }
        .btn-main { background: #00d1b2; color: black; }
        .btn-gen { background: #ffdd57; color: black; }
        .btn-copy-otp { background: #ff3860; color: white; margin-top: 10px; font-size: 0.8rem; padding: 8px; width: auto; display: inline-block; }
        .btn-del { background: transparent; color: #666; font-size: 0.7rem; border: 1px solid #444; padding: 4px 8px; width: auto; float: right; }
        .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.7rem; color: #666; margin-top: 10px; }
        .pulse { width: 8px; height: 8px; background: #00d1b2; border-radius: 50%; display: inline-block; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
        
        .msg-list { text-align: left; margin-top: 20px; }
        .msg-item { background: #252525; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #00d1b2; overflow: hidden; }
        .msg-header { padding: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .msg-header:hover { background: #2d2d2d; }
        .msg-subject { font-size: 0.9rem; font-weight: bold; display: block; max-width: 80%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .msg-from { font-size: 0.7rem; color: #888; }
        .content-view { display: none; background: #111; padding: 15px; color: #bbb; font-size: 0.85rem; white-space: pre-wrap; border-top: 1px solid #333; }
        .content-view.open { display: block; }
        .arrow { font-size: 0.6rem; color: #666; transition: 0.3s; }
        .arrow.rotate { transform: rotate(180deg); }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0;">🛡️ Turbo Burner</h2>
    <label style="font-size: 0.8rem; color: #888;">Select Domain</label>
    <select id="domainList"></select>
    <button class="btn-gen" onclick="createNew()">✨ Create New Email</button>
    <div id="addr" class="email-box">Checking memory...</div>
    <button class="btn-main" onclick="copyText(email)">📋 Copy Email</button>
    <div class="status-bar"><span class="pulse"></span><span id="status">Syncing...</span></div>
    <div id="inbox" class="msg-list"></div>
</div>

<script>
    let token = localStorage.getItem('tm_token') || ""; 
    let email = localStorage.getItem('tm_email') || "";
    const api = "https://api.mail.tm";
    let lastMsgCount = 0;
    let isChecking = false; // Prevent overlapping requests

    async function init() {
        try {
            const doms = await fetch(`${api}/domains`).then(r => r.json());
            const list = document.getElementById('domainList');
            doms['hydra:member'].forEach(d => {
                let o = document.createElement('option');
                o.value = d.domain; o.innerText = "@" + d.domain;
                list.appendChild(o);
            });
            if (email && token) {
                document.getElementById('addr').innerText = email;
                check();
            }
        } catch (e) { document.getElementById('status').innerText = "Offline"; }
    }

    async function createNew() {
        const domain = document.getElementById('domainList').value;
        const user = Math.random().toString(36).substring(2, 12);
        const newEmail = `${user}@${domain}`;
        try {
            await fetch(`${api}/accounts`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({address: newEmail, password: "password123"})
            });
            const auth = await fetch(`${api}/token`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({address: newEmail, password: "password123"})
            }).then(r => r.json());
            token = auth.token; email = newEmail;
            localStorage.setItem('tm_token', token);
            localStorage.setItem('tm_email', email);
            document.getElementById('addr').innerText = email;
            document.getElementById('inbox').innerHTML = "";
            lastMsgCount = 0;
        } catch (e) { alert("Rate limit or Error. Try again in a moment."); }
    }

    async function check() {
        if (!token || isChecking) return;
        isChecking = true;
        try {
            const res = await fetch(`${api}/messages`, {
                headers: {'Authorization': `Bearer ${token}`}
            }).then(r => r.json());
            const messages = res['hydra:member'];
            
            if (messages.length !== lastMsgCount) {
                lastMsgCount = messages.length;
                const box = document.getElementById('inbox');
                box.innerHTML = "";
                
                for (let m of messages) {
                    let d = document.createElement('div');
                    d.className = 'msg-item';
                    d.innerHTML = `
                        <div class="msg-header" onclick="toggleMsg(this)">
                            <div>
                                <span class="msg-from">${m.from.address}</span><br>
                                <span class="msg-subject">${m.subject}</span>
                            </div>
                            <span class="arrow">▼</span>
                        </div>
                        <div class="content-view" id="content-${m.id}">Loading content...</div>
                    `;
                    box.appendChild(d);
                }
            }
            document.getElementById('status').innerText = "Live: " + new Date().toLocaleTimeString();
        } catch (e) { 
            document.getElementById('status').innerText = "API Busy..."; 
        } finally {
            isChecking = false;
        }
    }

    async function toggleMsg(header) {
        const contentView = header.nextElementSibling;
        const arrow = header.querySelector('.arrow');
        const msgId = contentView.id.replace('content-', '');

        const isOpen = contentView.classList.toggle('open');
        arrow.classList.toggle('rotate');

        if (isOpen && contentView.innerText === "Loading content...") {
            try {
                const fullMsg = await fetch(`${api}/messages/${msgId}`, {
                    headers: {'Authorization': `Bearer ${token}`}
                }).then(r => r.json());
                
                let otp = extractOTP(fullMsg.text || fullMsg.intro);
                contentView.innerHTML = `
                    <button class="btn-del" onclick="deleteMsg('${msgId}')">Delete</button>
                    <div>${fullMsg.text || "No text content"}</div>
                    ${otp ? `<button class="btn-copy-otp" onclick="copyText('${otp}')">📋 Copy OTP: ${otp}</button>` : ''}
                `;
            } catch (e) { contentView.innerText = "Error loading."; }
        }
    }

    async function deleteMsg(id) {
        try {
            await fetch(`${api}/messages/${id}`, {
                method: 'DELETE',
                headers: {'Authorization': `Bearer ${token}`}
            });
            check();
        } catch (e) { console.log("Del error"); }
    }

    function extractOTP(text) {
        if (!text) return null;
        const otpMatch = text.match(/\b\d{4,8}\b/);
        return otpMatch ? otpMatch[0] : null;
    }

    function copyText(val) {
        if(!val) return;
        navigator.clipboard.writeText(val);
        alert("Copied!");
    }

    setInterval(check, 1000); // 1-second sync interval
    init();
</script>
</body>
</html>
